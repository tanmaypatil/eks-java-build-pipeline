# Rendered by pipeline/orchestrator.py for each repo (double-underscore placeholders).
apiVersion: batch/v1
kind: Job
metadata:
  name: __JOB__
  namespace: __NAMESPACE__
  labels: {app: jbp-build, jbp/run: "__RUN_ID__", jbp/repo: "__REPO__"}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: __TIMEOUT__
  podFailurePolicy:
    rules:
      # spot reclaim / node drain: retry without counting against backoffLimit
      - action: Ignore
        onPodConditions: [{type: DisruptionTarget}]
      - action: FailJob
        onExitCodes: {operator: NotIn, values: [0]}
  template:
    metadata:
      labels: {app: jbp-build, jbp/run: "__RUN_ID__"}
    spec:
      restartPolicy: Never
      # the workspace PVC is ReadWriteOnce (EBS): keep builds on the orchestrator's node
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector: {matchLabels: {app: jbp-orchestrator}}
              topologyKey: kubernetes.io/hostname
      containers:
        - name: build
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          command: ["bash", "/app/build.sh"]
          env:
            - {name: REPO_NAME, value: "__REPO__"}
            - {name: TOOL, value: "__TOOL__"}
            - {name: WRAPPER, value: "__WRAPPER__"}
            - {name: JAVA, value: "__JAVA__"}
            - {name: WORKDIR, value: "__WORKDIR__"}
            - {name: RESULT_DIR, value: /workspace/results}
            - {name: DEP_CACHE, value: "__DEP_CACHE__"}
            - {name: MAVEN_ARGS_EXTRA, value: "__MAVEN_ARGS__"}
            - {name: GRADLE_ARGS_EXTRA, value: "__GRADLE_ARGS__"}
          resources:
            requests: {cpu: "__CPU__", memory: "__MEM__"}
            limits:   {cpu: "__CPU__", memory: "__MEM__"}
          volumeMounts:
            - {name: workspace, mountPath: /workspace}
            - {name: code, mountPath: /app, readOnly: true}
      volumes:
        - name: workspace
          persistentVolumeClaim: {claimName: __PVC__}
        - name: code
          configMap: {name: jbp-code}
