apiVersion: batch/v1
kind: Job
metadata:
  name: jbp-orchestrator
  namespace: __NAMESPACE__
  labels: {app: jbp-orchestrator, jbp/run: "__RUN_ID__"}
spec:
  backoffLimit: 0
  podFailurePolicy:
    rules:
      - action: Ignore      # spot reclaim: rerun; repos already built are skipped (SKIP_DONE=1)
        onPodConditions: [{type: DisruptionTarget}]
  template:
    metadata:
      labels: {app: jbp-orchestrator, jbp/run: "__RUN_ID__"}
    spec:
      serviceAccountName: jbp-orchestrator
      restartPolicy: Never
      containers:
        - name: orchestrator
          image: __ORCH_IMAGE__
          command: ["bash", "/scripts/orchestrator.sh"]
          env:
            - {name: LAUNCHER, value: k8s}
            - {name: RUN_ID, value: "__RUN_ID__"}
            - {name: NAMESPACE, value: "__NAMESPACE__"}
            - {name: MAX_PARALLEL, value: "__MAX_PARALLEL__"}
            - {name: BUILD_CPU, value: "__BUILD_CPU__"}
            - {name: BUILD_MEM, value: "__BUILD_MEM__"}
            - {name: BUILD_TIMEOUT_S, value: "__BUILD_TIMEOUT_S__"}
            - {name: DEP_CACHE, value: "__DEP_CACHE__"}
            - {name: MAVEN_ARGS_EXTRA, value: "__MAVEN_ARGS_EXTRA__"}
            - {name: GRADLE_ARGS_EXTRA, value: "__GRADLE_ARGS_EXTRA__"}
            - {name: IMAGE_REGISTRY, value: "__IMAGE_REGISTRY__"}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: workspace, mountPath: /workspace}
            - {name: scripts, mountPath: /scripts, readOnly: true}
            - {name: config, mountPath: /config, readOnly: true}
            - {name: templates, mountPath: /templates, readOnly: true}
      volumes:
        - {name: workspace, persistentVolumeClaim: {claimName: jbp-workspace}}
        - {name: scripts, configMap: {name: jbp-scripts}}
        - {name: config, configMap: {name: jbp-config}}
        - {name: templates, configMap: {name: jbp-templates}}
